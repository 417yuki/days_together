name: Apply native custom location control fix

on:
  push:
    branches:
      - agent/remove-ime-click-hijack

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-ime-click-hijack
      - name: Remove IME click interception and fix composition flush order
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/app/App.ts')
          app = app_path.read_text()

          old_render = '''  private render(): void {
    if (this.textCompositionActive) { this.renderQueuedDuringComposition = true; return; }
    const focused ='''
          new_render = '''  private render(): void {
    if (this.textCompositionActive) { this.renderQueuedDuringComposition = true; return; }
    this.renderQueuedDuringComposition = false;
    const focused ='''
          if old_render not in app:
              raise SystemExit('render guard anchor not found')
          app = app.replace(old_render, new_render, 1)

          old_guard = '''  private bindTextCompositionGuard(): void {
    const finish = (): void => {
      if (!this.textCompositionActive) return;
      this.textCompositionActive = false;
      if (!this.renderQueuedDuringComposition) return;
      this.renderQueuedDuringComposition = false;
      requestAnimationFrame(() => this.render());
    };
    this.root.querySelectorAll<HTMLInputElement>('input[type="text"]').forEach((input) => {
      input.addEventListener("compositionstart", () => { this.textCompositionActive = true; });
      input.addEventListener("compositionend", finish);
      input.addEventListener("blur", finish);
    });
  }'''
          new_guard = '''  private bindTextCompositionGuard(): void {
    const release = (flushQueuedRender: boolean): void => {
      if (!this.textCompositionActive) return;
      this.textCompositionActive = false;
      if (!flushQueuedRender || !this.renderQueuedDuringComposition) return;
      this.renderQueuedDuringComposition = false;
      requestAnimationFrame(() => this.render());
    };
    this.root.querySelectorAll<HTMLInputElement>('input[type="text"]').forEach((input) => {
      input.addEventListener("compositionstart", () => { this.textCompositionActive = true; });
      input.addEventListener("compositionend", () => release(true));
      input.addEventListener("blur", () => {
        // A button tap blurs the input before click. Release the guard without
        // replacing the button; the button action performs the next render.
        release(false);
        window.setTimeout(() => {
          if (this.textCompositionActive || !this.renderQueuedDuringComposition) return;
          this.renderQueuedDuringComposition = false;
          this.render();
        }, 180);
      });
    });
  }'''
          if old_guard not in app:
              raise SystemExit('composition guard anchor not found')
          app = app.replace(old_guard, new_guard, 1)

          old_add_tail = '''ui.message = "地点を追加しました。保存するまで未確定です。"; this.render(); const input = this.root.querySelector<HTMLInputElement>(`[data-focus-key="custom-location-name-${id}-${CSS.escape(location.locationId)}"]`); input?.focus({ preventScroll: true }); input?.select(); }'''
          new_add_tail = '''ui.message = "地点を追加しました。保存するまで未確定です。"; this.render(); }'''
          if old_add_tail not in app:
              raise SystemExit('custom location focus anchor not found')
          app = app.replace(old_add_tail, new_add_tail, 1)
          app_path.write_text(app)

          main_path = Path('src/main.ts')
          main = main_path.read_text()
          main = main.replace('import { installCustomLocationImeBridge } from "./app/customLocationImeBridge";\n', '')
          main = main.replace('\ninstallCustomLocationImeBridge();\n', '\n')
          main_path.write_text(main)

          bridge = Path('src/app/customLocationImeBridge.ts')
          if bridge.exists():
              bridge.unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/App.ts src/main.ts src/app/customLocationImeBridge.ts
          git commit -m "fix: restore native custom location controls"
          git push origin HEAD:agent/remove-ime-click-hijack
