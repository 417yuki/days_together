name: Apply item slot preview fix

on:
  push:
    branches:
      - agent/fix-item-slot-preview-background

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-item-slot-preview-background
      - name: Apply focused source and roadmap updates
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          settings_path = Path("src/ui/screens/SettingsScreen.ts")
          source = settings_path.read_text()
          old_call = "itemSlotEditor(state, itemSlots, actions)"
          new_call = "itemSlotEditor(state, backgrounds, itemSlots, actions)"
          if old_call not in source and new_call not in source:
              raise SystemExit("itemSlotEditor call site was not found")
          source = source.replace(old_call, new_call, 1)

          start = source.find("const itemSlotEditor = (")
          if start < 0:
              raise SystemExit("itemSlotEditor definition was not found")

          replacement = '''const itemSlotEditor = (state: AppState, backgrounds: Record<MapBackgroundId, MapBackgroundUi>, ui: ItemSlotsUi, actions: SettingsActions): HTMLElement => {
            const root = document.createElement("section"); root.className = "location-layout-editor item-slot-editor"; root.append(text("h3", "アイテムを配置"), text("p", "六つの固定枠をまとめて編集します。保存までは通常マップへ反映されません。"));
            const tabs = document.createElement("div"); tabs.className = "map-tabs"; MAP_BACKGROUND_IDS.forEach((id) => { const control = button(id === "starter_house_interior" ? "室内" : "庭", () => actions.selectItemSlotMap(id), ui.saving); if (id === ui.selectedMapId) control.setAttribute("aria-current", "true"); tabs.append(control); }); root.append(tabs);
            const preset = starterMaps.find((map) => map.mapId === ui.selectedMapId)!; const map = resolveMapLayout(preset, state.mapVisuals[ui.selectedMapId].locationLayout); const preview = document.createElement("div"); preview.className = `location-layout-preview item-slot-preview map-canvas--${map.mapType}`;
            const backgroundUrl = backgrounds[ui.selectedMapId].url; if (backgroundUrl) { const image = document.createElement("img"); image.src = backgroundUrl; image.alt = ""; image.addEventListener("error", () => image.remove()); preview.append(image); }
            map.locations.forEach((location) => { const marker = text("span", location.label, "layout-location item-slot-location"); marker.style.left = `${location.position.x * 100}%`; marker.style.top = `${location.position.y * 100}%`; marker.setAttribute("aria-hidden", "true"); preview.append(marker); });
            Object.entries(ui.draft[ui.selectedMapId]).forEach(([id, slot], index) => { const item = state.items.find((v) => v.itemId === slot.itemId), control = button(item?.name ?? `空き${index + 1}`, () => actions.selectItemSlot(id), ui.saving); control.className = `slot-preview${id === ui.selectedSlotId ? " is-selected" : ""}`; control.style.left = `${slot.position.x * 100}%`; control.style.top = `${slot.position.y * 100}%`; if (id === ui.selectedSlotId) control.setAttribute("aria-current", "true"); preview.append(control); }); root.append(preview);
            const slot = ui.draft[ui.selectedMapId][ui.selectedSlotId] ?? Object.values(ui.draft[ui.selectedMapId])[0], selectLabel = document.createElement("label"), select = document.createElement("select"); selectLabel.append(text("span", "配置するアイテム"), select); const empty = document.createElement("option"); empty.value = ""; empty.textContent = "何も置かない"; select.append(empty); state.items.forEach((item) => { const option = document.createElement("option"); option.value = item.itemId; option.textContent = `${item.name}（${categoryLabels[item.category]}）`; option.selected = item.itemId === slot.itemId; select.append(option); }); select.addEventListener("change", () => actions.assignItemSlot(select.value || null)); root.append(selectLabel);
            (["x", "y"] as const).forEach((axis) => { const label = document.createElement("label"), output = document.createElement("output"), input = document.createElement("input"); input.type = "range"; input.min = ".05"; input.max = ".95"; input.step = ".01"; input.value = String(slot.position[axis]); output.textContent = `${Math.round(slot.position[axis] * 100)}%`; label.append(text("span", axis === "x" ? "横位置" : "縦位置"), output, input); input.addEventListener("input", () => actions.updateItemSlotPosition(axis === "x" ? Number(input.value) : slot.position.x, axis === "y" ? Number(input.value) : slot.position.y)); root.append(label); });
            const controls = document.createElement("div"); controls.className = "pin-visual-actions"; controls.append(button("このスロットを空にする", actions.clearItemSlot, ui.saving), button("このスロットの位置を初期値へ戻す", actions.resetItemSlotPosition, ui.saving), button("全スロットの位置を初期配置へ戻す", actions.resetAllItemSlotPositions, ui.saving), button("すべてのアイテムを外す", actions.clearAllItemSlots, ui.saving), button("この配置を保存", actions.saveItemSlots, ui.saving), button("キャンセル", actions.cancelItemSlots, ui.saving)); const live = text("p", ui.message, "character-image-live"); live.setAttribute("aria-live", "polite"); root.append(controls, live); return root;
          };
          '''
          settings_path.write_text(source[:start] + replacement)

          css_path = Path("src/styles/components.css")
          css = css_path.read_text()
          css_rule = "\n.item-slot-location { pointer-events: none; opacity: .72; }\n"
          if ".item-slot-location" not in css:
              css_path.write_text(css.rstrip() + "\n" + css_rule)

          roadmap_path = Path("docs/ROADMAP.md")
          roadmap = roadmap_path.read_text()
          heading = "### 通常マップ上でアイテムを直接配置する操作"
          if heading not in roadmap:
              marker = "### その他"
              note = '''### 通常マップ上でアイテムを直接配置する操作

- 通常マップに明示的な配置編集モードを用意し、通常の移動、イベント、アイテム詳細操作と競合させない
- 所持品からマップへドラッグ＆ドロップするか、配置済みアイテムを一本指でドラッグして位置を調整できる流れを候補とする
- iPhoneでは長押し、ページスクロール、ブラウザのコンテキスト操作との競合を避ける
- タッチ操作だけを必須にせず、現在のスロット選択、range入力、明示保存、キャンセルを代替手段として残す
- 保存前ドラフト、一つのアイテムは一ヶ所まで、アイテム本体は所持品へ残す、保存失敗時は旧配置維持という既存ルールを引き継ぐ
- 固定六スロットを直接操作する段階と、自由配置へ拡張する段階を分け、実装時に独立した詳細仕様を作る

'''
              if marker not in roadmap:
                  raise SystemExit("ROADMAP insertion marker was not found")
              roadmap_path.write_text(roadmap.replace(marker, note + marker, 1))
          PY
      - name: Commit applied changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/screens/SettingsScreen.ts src/styles/components.css docs/ROADMAP.md
          git commit -m "アイテム配置プレビューへ背景と地点を表示"
          git push origin HEAD:agent/fix-item-slot-preview-background
